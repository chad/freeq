# yaml-language-server: $schema=https://docs.514.ax/schema/experiment.v2.schema.yaml
schema_version: 2
id: freeq-auth-handshake
name: "Can an agent complete the SASL handshake at all?"
description: |
  Research question: Five of six onboarding runs died on
  `904 SASL authentication failed (bad response)` while insisting their Ed25519
  signature was correct. It was — the response envelope has to be
  base64url-unpadded and every stdlib encoder emits standard base64. Does
  writing that down fix it?

  Measure: pass rate of `authenticated` (the live server issued a bearer token
  bound to the agent's DID, checked server-side, not from the agent's report),
  control vs treatment, 4 trials each.

  Why this experiment is smaller than freeq-agent-onboarding: at a 300 s cap,
  ~65% of onboarding runs were killed before writing anything, and a killed run
  produces no test rows at all — no artifact, no diagnosis, nothing but spend.
  The handshake is the step everything was failing at, so measuring it alone
  buys the same answer inside the budget. Effort is `low` for the same reason:
  the failing runs were not thinking too little.

  Bet: control 0-1 of 4; treatment 3-4 of 4. If the treatment also fails, the
  envelope encoding was not the whole story and the next move is the server
  (a 904 that names the encoding, not just "bad response").

agents: claude
models:
  - name: claude-sonnet-4-6
    effort: low

prompts:
  - id: authenticate
    prompt: |
      Authenticate to the freeq IRC server at `irc.freeq.at` as an identity you
      mint yourself, and prove you did.

      Reference documentation is in `/workspace/docs/`. You also have network
      access. Do not ask a human for anything, and do not connect as a guest.

      On success the server sends numeric `903` and then a line of the form
      `NOTICE * :API-BEARER <token>`. That token is a REST credential:

      ```
      curl -H 'Authorization: Bearer <token>' https://irc.freeq.at/api/v1/sessions
      ```

      Write `/workspace/result.json`:

      ```json
      {
        "status": "ok",
        "did": "<the DID you authenticated as>",
        "got_903": true,
        "sessions_url_status": <the HTTP status you got from /api/v1/sessions with your token>,
        "sessions_body": "<the first 400 characters of that response>",
        "blocked_on": ""
      }
      ```

      Do NOT put the bearer token itself, your private key, or any filesystem
      path in `result.json`.

      You have a hard 5-minute budget and a killed run scores as a total
      failure. Your first command is `date +%s`; add 210 and treat that as your
      abort time. At the abort time, stop and write `result.json` with
      `"status": "blocked"` and `blocked_on` set to one sentence naming exactly
      what stopped you — including the verbatim server response if you got one.
      A precise `blocked_on` on time beats an unfinished attempt.

products:
  - name: auth-as-shipped
    type: Docs
    description: |
      Control - agents.md + auth.md as they were on 2026-09-08, frozen under
      fixtures/. Step 3 says "sign the exact challenge bytes and send the
      signature base64url-unpadded" and says nothing about the envelope, the
      CAP ordering, or what each 904 means.
    tags: ["arm:control"]
    setup:
      - name: stage-shipped-auth
        script: |
          set -eux
          test -f /workspace/docs/auth.md
        files:
          - name: agents-shipped
            source: fixtures/agents-as-shipped.md
            dest: docs/agents.md
          - name: auth-shipped
            source: fixtures/auth-as-shipped.md
            dest: docs/auth.md

  - name: auth-rewritten
    type: Docs
    description: |
      Treatment - the same agents.md, plus the rewritten auth.md: the full wire
      sequence starting at CAP LS 302, which bytes get signed, the envelope
      encoding spelled out as base64url-unpadded with a warning that stdlib
      defaults are wrong, a worked Python example, and a table translating each
      904 reason.
    tags: ["arm:treatment"]
    setup:
      - name: stage-rewritten-auth
        script: |
          set -eux
          test -f /workspace/docs/auth.md
        files:
          - name: agents-shipped-t
            source: fixtures/agents-as-shipped.md
            dest: docs/agents.md
          - name: auth-rewritten-md
            source: ../../agent-docs/auth.md
            dest: docs/auth.md

tests:
  - name: reported-back-in-budget
    description: |
      Came back with a written verdict instead of being killed. Prints
      blocked_on, which across arms is the actual output of this experiment.
    script: |
      set -euo pipefail
      test -s /workspace/result.json
      python3 - <<'PY'
      import json, sys
      d = json.load(open('/workspace/result.json'))
      status = (d.get("status") or "").lower()
      if status not in ("ok", "blocked"):
          sys.exit(f"status must be ok|blocked, got {d.get('status')!r}")
      print("STATUS:", status)
      print("DID:", d.get("did") or "(none)")
      print("SESSIONS_STATUS:", d.get("sessions_url_status"))
      print("BLOCKED_ON:", (d.get("blocked_on") or "").strip()[:600] or "(none)")
      PY

  - name: authenticated
    description: |
      THE metric, and it is checked against the server rather than the agent's
      say-so: the DID it claims must be one the live server will resolve as an
      actor, and the agent must have reported a 200 from /api/v1/sessions with
      the bearer that only a completed SASL exchange can mint.
    script: |
      set -euo pipefail
      python3 - <<'PY'
      import json, sys, urllib.request
      d = json.load(open('/workspace/result.json'))
      if (d.get("status") or "").lower() != "ok":
          sys.exit(f"status={d.get('status')!r}: {(d.get('blocked_on') or '')[:300]}")
      if not d.get("got_903"):
          sys.exit("never received 903")
      did = (d.get("did") or "").strip()
      if not did.startswith("did:"):
          sys.exit(f"not a DID: {did!r}")
      if int(d.get("sessions_url_status") or 0) != 200:
          sys.exit(f"/api/v1/sessions answered {d.get('sessions_url_status')!r}, so the bearer was not real")
      req = urllib.request.Request("https://irc.freeq.at/api/v1/actors/" + did)
      try:
          with urllib.request.urlopen(req, timeout=30) as r:
              body = json.load(r)
      except Exception as e:
          sys.exit(f"server does not know {did}: {e}")
      print("ok", did, json.dumps(body)[:200])
      PY

  - name: reached-the-904-wall
    description: |
      Inverted diagnostic: FAILS when the session hit
      `SASL authentication failed` at any point. Passes for a clean first-try
      handshake. This is the number the auth.md rewrite is supposed to move.
    script: |
      set -euo pipefail
      ax-run-query "$AX_RUN_ID" sql "
        SELECT count(*) AS hits FROM events
        WHERE source IN ('stdout','transcript')
          AND (payload ILIKE '%SASL authentication failed%' OR payload ILIKE '%904%')
      " --format json > /tmp/wall.json
      cat /tmp/wall.json
      python3 - <<'PY'
      import json, sys
      rows = [json.loads(l) for l in open('/tmp/wall.json') if l.strip()]
      hits = int(rows[0].get("hits", 0)) if rows else 0
      if hits:
          sys.exit(f"hit SASL failure {hits} times before giving up or recovering")
      print("ok: clean handshake")
      PY

  - name: no-token-or-key-in-the-artifact
    description: |
      Safety counter-test. The bearer is a live credential and the private key
      is the identity; neither belongs in a file the harness collects.
    script: |
      set -euo pipefail
      python3 - <<'PY'
      import json, re, sys
      raw = open('/workspace/result.json', encoding='utf-8', errors='replace').read()
      bad = [p for p in (r"stream-[A-Za-z0-9]{8,}", r"PRIVATE KEY", r"BEGIN [A-Z ]*KEY",
                         r"/Users/", r"/home/[a-z]", r"\bsk-ant-") if re.search(p, raw, re.I)]
      if bad:
          sys.exit(f"credential-ish material in result.json: {bad}")
      print("ok")
      PY

limits:
  max_time_seconds: 300
